<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <title>Custom Card Generator</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>
  <div class="app-container">
    <div class="controls-panel">
      <h2>የካርድ ማዘጋጃ</h2>
      
      <div class="control-group">
        <label>የካርድ ሳይዝ (px):</label>
        <div class="style-row">
            <input type="number" id="canvas-width" value="600" placeholder="Width">
            <input type="number" id="canvas-height" value="380" placeholder="Height">
        </div>
      </div>

      <div class="control-group">
        <label>የካርድ ጀርባ:</label>
        <input type="file" id="bg-uploader" accept="image/*">
        <div class="bg-controls">
            <label>Zoom:</label>
            <input type="range" id="bg-zoom" min="0.5" max="3" step="0.1" value="1">
            <label>Move X/Y:</label>
            <input type="range" id="bg-x" min="-200" max="200" value="0">
            <input type="range" id="bg-y" min="-200" max="200" value="0">
        </div>
      </div>

      <div class="control-group">
        <label>ጽሁፍ ጨምር:</label>
        <input type="text" id="text-input">
        <button id="add-text-btn">+ ጽሁፍ ጨምር</button>
      </div>

      <div class="control-group">
        <button id="download-btn" class="download-btn">📥 ካርዱን አውርድ (PNG)</button>
      </div>
    </div>

    <div class="canvas-container">
      <div id="card-canvas">
        <div id="bg-wrapper"><img id="card-bg" src=""></div>
        <div id="canvas-placeholder">ፎቶ ይጫኑ</div>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
