<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Results Admin</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --blue:#1D6FE0; --blue-dark:#144DA6; --blue-soft:#EAF2FF;
    --bg:#F3F5F8; --card:#FFFFFF; --line:#E7EAEE;
    --text:#1A1F29; --text-2:#6B7280; --text-3:#9CA3AF;
    --green:#0F9D58; --green-soft:#E6F7EE;
    --red:#E03131; --red-soft:#FDEBEB;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;line-height:1.5;}
  .wrap{max-width:760px;margin:0 auto;padding:20px 16px 60px;}
  .hidden{display:none !important;}

  header{display:flex;align-items:center;gap:12px;margin-bottom:20px;}
  header .logo{width:40px;height:40px;border-radius:50%;background:var(--blue-soft);color:var(--blue);display:flex;align-items:center;justify-content:center;font-size:20px;}
  header h1{font-size:17px;margin:0;color:var(--blue-dark);}

  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:16px;}
  .card h2{font-size:14px;margin:0 0 14px;color:var(--text);}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:12px;color:var(--text-2);margin-bottom:5px;font-weight:600;}
  input,select,textarea{
    width:100%;padding:9px 11px;border:1.5px solid var(--line);border-radius:7px;
    font-family:'Inter',sans-serif;font-size:14px;color:var(--text);background:#fff;
  }
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue);}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media(max-width:520px){.grid2{grid-template-columns:1fr;}}

  button{
    font-family:'Inter',sans-serif;font-size:13.5px;font-weight:700;border-radius:8px;padding:10px 18px;
    cursor:pointer;border:1.5px solid var(--line);background:#fff;color:var(--text);
  }
  button.primary{background:var(--blue);color:#fff;border-color:var(--blue);}
  button.primary:hover{background:var(--blue-dark);}
  button.danger{color:var(--red);border-color:var(--red-soft);}
  button.danger:hover{background:var(--red-soft);}
  button:disabled{opacity:.55;cursor:not-allowed;}
  .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap;}

  .subj-row{display:grid;grid-template-columns:1fr 100px 32px;gap:8px;margin-bottom:8px;align-items:center;}
  .subj-row button{padding:6px;font-size:12px;}

  .msg{font-size:12.5px;margin-top:10px;display:none;padding:8px 10px;border-radius:6px;}
  .msg.ok{background:var(--green-soft);color:var(--green);display:block;}
  .msg.err{background:var(--red-soft);color:var(--red);display:block;}

  .stu-item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line);font-size:13.5px;}
  .stu-item:last-child{border-bottom:none;}
  .stu-item .name{font-weight:700;}
  .stu-item .sub{font-size:11.5px;color:var(--text-2);}
  .stu-item .btns{display:flex;gap:6px;}
  .stu-item .btns button{padding:5px 10px;font-size:11.5px;}

  .login-box{max-width:320px;margin:80px auto;text-align:center;}
  .login-box input{margin-bottom:10px;text-align:center;}

  .drop-zone{
    border:2px dashed var(--line);border-radius:10px;padding:24px;text-align:center;
    color:var(--text-2);font-size:13px;cursor:pointer;
  }
  .drop-zone:hover{border-color:var(--blue);}
  .empty{text-align:center;padding:26px;color:var(--text-3);font-size:13px;}
</style>
</head>
<body>
<div class="wrap">

  <div id="login-screen">
    <div class="login-box card">
      <h2>🔒 Admin Login</h2>
      <input type="password" id="admin-pass" placeholder="Admin password">
      <button type="button" class="primary" id="btn-login" style="width:100%;">Login</button>
      <div class="msg err" id="login-err"></div>
    </div>
  </div>

  <div id="admin-screen" class="hidden">
    <header>
      <div class="logo">🎓</div>
      <h1>Student Results — Admin</h1>
    </header>

    <div class="card">
      <h2>➕ Add / Edit Student</h2>
      <div class="field"><label>Registration Number (unique ID)</label><input type="text" id="f-reg"></div>
      <div class="grid2">
        <div class="field"><label>Full Name</label><input type="text" id="f-name"></div>
        <div class="field"><label>Photo URL (link)</label><input type="text" id="f-photo" placeholder="https://..."></div>
        <div class="field"><label>Nationality</label><input type="text" id="f-nat" value="Ethiopian"></div>
        <div class="field"><label>Gender</label>
          <select id="f-gender"><option>Male</option><option>Female</option></select>
        </div>
        <div class="field"><label>Zone</label><input type="text" id="f-zone"></div>
        <div class="field"><label>Woreda</label><input type="text" id="f-woreda"></div>
        <div class="field"><label>Grade</label><input type="text" id="f-grade"></div>
        <div class="field"><label>School</label><input type="text" id="f-school"></div>
        <div class="field"><label>Academic Year</label><input type="text" id="f-year"></div>
        <div class="field"><label>Status</label>
          <select id="f-status"><option>Passed</option><option>Failed</option></select>
        </div>
        <div class="field"><label>Total Score</label><input type="text" id="f-total"></div>
        <div class="field"><label>Mark</label><input type="text" id="f-mark"></div>
        <div class="field"><label>Percentile</label><input type="text" id="f-percentile"></div>
        <div class="field"><label>Average</label><input type="text" id="f-average"></div>
      </div>

      <div class="field">
        <label>Subject Wise Results</label>
        <div id="subj-rows"></div>
        <button type="button" id="btn-add-subj">+ Add subject</button>
      </div>

      <div class="actions">
        <button type="button" id="btn-clear-form">Clear</button>
        <button type="button" class="primary" id="btn-save-student">Save Student</button>
      </div>
      <div class="msg" id="save-msg"></div>
    </div>

    <div class="card">
      <h2>📥 Bulk Upload (CSV / Excel)</h2>
      <p style="font-size:12px;color:var(--text-2);margin:0 0 12px;">
        Columns: registrationNumber, name, photoUrl, nationality, gender, zone, woreda, grade, school, academicYear, status, totalScore, mark, percentile, average
      </p>
      <label class="drop-zone" for="bulk-file">📎 Click to choose a .csv or .xlsx file</label>
      <input type="file" id="bulk-file" accept=".csv,.xlsx,.xls" style="display:none;">
      <div class="msg" id="bulk-msg"></div>
    </div>

    <div class="card">
      <h2>👥 Students (<span id="stu-count">0</span>)</h2>
      <input type="text" id="stu-search" placeholder="Search by name or registration number..." style="margin-bottom:10px;">
      <div id="students-list"></div>
    </div>
  </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
import {
  getFirestore, collection, doc, setDoc, getDoc, getDocs, deleteDoc
} from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAZ7MU2B58bWcu-8jH9Pvv5Ob9XGQyx4NU",
  authDomain: "halal-report-2.firebaseapp.com",
  projectId: "halal-report-2",
  storageBucket: "halal-report-2.firebasestorage.app",
  messagingSenderId: "242965792260",
  appId: "1:242965792260:web:8dd83989172924f8c5d751"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// ⚠️ ይህን ኮድ ብቻ ወደ ራስዎ ይቀይሩ
const RESULTS_ADMIN_PASSWORD = 'RESULTS-ADMIN-2026';

function escapeAttr(str){
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

// ---- Login ----
document.getElementById('btn-login').addEventListener('click', ()=>{
  const pass = document.getElementById('admin-pass').value;
  if(pass === RESULTS_ADMIN_PASSWORD){
    document.getElementById('login-screen').classList.add('hidden');
    document.getElementById('admin-screen').classList.remove('hidden');
    loadStudents();
  }else{
    document.getElementById('login-err').textContent = 'Incorrect password.';
    document.getElementById('login-err').classList.add('err');
    document.getElementById('login-err').style.display = 'block';
  }
});
document.getElementById('admin-pass').addEventListener('keydown', (e)=>{
  if(e.key === 'Enter') document.getElementById('btn-login').click();
});

// ---- Subject rows ----
function addSubjectRow(name='', score=''){
  const row = document.createElement('div');
  row.className = 'subj-row';
  row.innerHTML = `
    <input type="text" placeholder="Subject name" class="subj-name" value="${escapeAttr(name)}">
    <input type="text" placeholder="Score" class="subj-score" value="${escapeAttr(score)}">
    <button type="button" class="subj-rm">✕</button>
  `;
  row.querySelector('.subj-rm').addEventListener('click', ()=> row.remove());
  document.getElementById('subj-rows').appendChild(row);
}
document.getElementById('btn-add-subj').addEventListener('click', ()=> addSubjectRow());

function clearForm(){
  ['f-reg','f-name','f-photo','f-zone','f-woreda','f-grade','f-school','f-year','f-total','f-mark','f-percentile','f-average']
    .forEach(id=> document.getElementById(id).value = '');
  document.getElementById('f-nat').value = 'Ethiopian';
  document.getElementById('f-gender').value = 'Male';
  document.getElementById('f-status').value = 'Passed';
  document.getElementById('subj-rows').innerHTML = '';
  addSubjectRow();
  document.getElementById('save-msg').style.display = 'none';
}
document.getElementById('btn-clear-form').addEventListener('click', clearForm);
clearForm();

function collectSubjects(){
  return Array.from(document.querySelectorAll('#subj-rows .subj-row')).map(row=>({
    name: row.querySelector('.subj-name').value.trim(),
    score: row.querySelector('.subj-score').value.trim()
  })).filter(s=> s.name);
}

// ---- Save single student ----
document.getElementById('btn-save-student').addEventListener('click', async ()=>{
  const msg = document.getElementById('save-msg');
  msg.style.display = 'none';
  const reg = document.getElementById('f-reg').value.trim();
  const name = document.getElementById('f-name').value.trim();
  if(!reg || !name){
    msg.className = 'msg err'; msg.textContent = 'Registration Number and Name are required.'; msg.style.display = 'block';
    return;
  }
  const data = {
    registrationNumber: reg,
    name,
    photoUrl: document.getElementById('f-photo').value.trim(),
    nationality: document.getElementById('f-nat').value.trim(),
    gender: document.getElementById('f-gender').value,
    zone: document.getElementById('f-zone').value.trim(),
    woreda: document.getElementById('f-woreda').value.trim(),
    grade: document.getElementById('f-grade').value.trim(),
    school: document.getElementById('f-school').value.trim(),
    academicYear: document.getElementById('f-year').value.trim(),
    status: document.getElementById('f-status').value,
    totalScore: document.getElementById('f-total').value.trim(),
    mark: document.getElementById('f-mark').value.trim(),
    percentile: document.getElementById('f-percentile').value.trim(),
    average: document.getElementById('f-average').value.trim(),
    subjects: collectSubjects(),
    updatedAt: Date.now()
  };
  const btn = document.getElementById('btn-save-student');
  btn.disabled = true; btn.textContent = 'Saving...';
  try{
    await setDoc(doc(db,'students',reg), data);
    msg.className = 'msg ok'; msg.textContent = 'Saved successfully.'; msg.style.display = 'block';
    clearForm();
    loadStudents();
  }catch(e){
    console.error(e);
    msg.className = 'msg err'; msg.textContent = 'Save failed, please try again.'; msg.style.display = 'block';
  }
  btn.disabled = false; btn.textContent = 'Save Student';
});

// ---- Bulk upload ----
document.getElementById('bulk-file').addEventListener('change', async (e)=>{
  const file = e.target.files && e.target.files[0];
  if(!file) return;
  const msg = document.getElementById('bulk-msg');
  msg.className = 'msg'; msg.style.display = 'none';
  try{
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type: 'array' });
    const ws = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(ws, { defval: '' });
    if(rows.length === 0){ throw new Error('No rows found'); }

    let count = 0;
    for(const r of rows){
      const reg = String(r.registrationNumber || r.RegistrationNumber || '').trim();
      if(!reg) continue;
      await setDoc(doc(db,'students',reg), {
        registrationNumber: reg,
        name: String(r.name || r.Name || ''),
        photoUrl: String(r.photoUrl || r.PhotoUrl || ''),
        nationality: String(r.nationality || r.Nationality || 'Ethiopian'),
        gender: String(r.gender || r.Gender || ''),
        zone: String(r.zone || r.Zone || ''),
        woreda: String(r.woreda || r.Woreda || ''),
        grade: String(r.grade || r.Grade || ''),
        school: String(r.school || r.School || ''),
        academicYear: String(r.academicYear || r.AcademicYear || ''),
        status: String(r.status || r.Status || ''),
        totalScore: String(r.totalScore || r.TotalScore || ''),
        mark: String(r.mark || r.Mark || ''),
        percentile: String(r.percentile || r.Percentile || ''),
        average: String(r.average || r.Average || ''),
        subjects: [],
        updatedAt: Date.now()
      });
      count++;
    }
    msg.className = 'msg ok'; msg.textContent = `${count} students uploaded successfully.`; msg.style.display = 'block';
    loadStudents();
  }catch(err){
    console.error(err);
    msg.className = 'msg err'; msg.textContent = 'Upload failed — check the file format and column names.'; msg.style.display = 'block';
  }
  e.target.value = '';
});

// ---- Students list ----
let allStudents = [];
async function loadStudents(){
  try{
    const snap = await getDocs(collection(db,'students'));
    allStudents = [];
    snap.forEach(d=> allStudents.push({ id:d.id, ...d.data() }));
    renderStudents();
  }catch(e){ console.error(e); }
}
function renderStudents(){
  const box = document.getElementById('students-list');
  const q = document.getElementById('stu-search').value.trim().toLowerCase();
  const filtered = q
    ? allStudents.filter(s=> (s.name||'').toLowerCase().includes(q) || (s.registrationNumber||'').toLowerCase().includes(q))
    : allStudents;
  document.getElementById('stu-count').textContent = allStudents.length;
  if(filtered.length === 0){ box.innerHTML = '<div class="empty">No students found.</div>'; return; }
  box.innerHTML = filtered.map(s=>`
    <div class="stu-item">
      <div>
        <div class="name">${escapeAttr(s.name)}</div>
        <div class="sub">${escapeAttr(s.registrationNumber)} · ${escapeAttr(s.school||'')} · ${escapeAttr(s.status||'')}</div>
      </div>
      <div class="btns">
        <button type="button" data-edit="${escapeAttr(s.registrationNumber)}">Edit</button>
        <button type="button" class="danger" data-del="${escapeAttr(s.registrationNumber)}">Delete</button>
      </div>
    </div>
  `).join('');
}
document.getElementById('stu-search').addEventListener('input', renderStudents);
document.getElementById('students-list').addEventListener('click', async (e)=>{
  const editBtn = e.target.closest('[data-edit]');
  const delBtn = e.target.closest('[data-del]');
  if(editBtn){
    const s = allStudents.find(x=>x.registrationNumber === editBtn.dataset.edit);
    if(!s) return;
    document.getElementById('f-reg').value = s.registrationNumber || '';
    document.getElementById('f-name').value = s.name || '';
    document.getElementById('f-photo').value = s.photoUrl || '';
    document.getElementById('f-nat').value = s.nationality || 'Ethiopian';
    document.getElementById('f-gender').value = s.gender || 'Male';
    document.getElementById('f-zone').value = s.zone || '';
    document.getElementById('f-woreda').value = s.woreda || '';
    document.getElementById('f-grade').value = s.grade || '';
    document.getElementById('f-school').value = s.school || '';
    document.getElementById('f-year').value = s.academicYear || '';
    document.getElementById('f-status').value = s.status || 'Passed';
    document.getElementById('f-total').value = s.totalScore || '';
    document.getElementById('f-mark').value = s.mark || '';
    document.getElementById('f-percentile').value = s.percentile || '';
    document.getElementById('f-average').value = s.average || '';
    document.getElementById('subj-rows').innerHTML = '';
    const subjects = Array.isArray(s.subjects) ? s.subjects : [];
    if(subjects.length){ subjects.forEach(sub=> addSubjectRow(sub.name, sub.score)); }
    else{ addSubjectRow(); }
    window.scrollTo({top:0, behavior:'smooth'});
  }
  if(delBtn){
    if(!confirm(`Delete student "${delBtn.dataset.del}"?`)) return;
    try{ await deleteDoc(doc(db,'students',delBtn.dataset.del)); loadStudents(); }
    catch(err){ console.error(err); }
  }
});
</script>
</body>
</html>
